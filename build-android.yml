name: Build Android app (.apk)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web app into the mobile project
        run: |
          mkdir -p mobile/www/icons
          cp index.html style.css script.js manifest.webmanifest sw.js icon.svg mobile/www/
          cp icons/*.png mobile/www/icons/

      - name: Install Capacitor and create Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android app
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Android
          path: mobile/android/app/build/outputs/apk/debug/*.apk
